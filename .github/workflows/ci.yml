name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            default-libmysqlclient-dev \
            build-essential \
            pkg-config

      - name: Install Poetry
        run: pipx install poetry

      - name: Install Python deps
        run: poetry install --with dev

      - name: Lint
        run: poetry run ruff check .

      - name: Tests (no runtime DB)
        run: poetry run pytest -m "not runtime"

  runtime:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: norm
          POSTGRES_PASSWORD: norm
          POSTGRES_DB: norm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U norm -d norm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: norm
          MYSQL_DATABASE: norm
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pnorm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:24
        ports:
          - 9000:9000
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: norm
      POSTGRES_PASSWORD: norm
      POSTGRES_DB: norm
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: norm
      MYSQL_DATABASE: norm
      CLICKHOUSE_HOST: 127.0.0.1
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DATABASE: default
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            default-libmysqlclient-dev \
            build-essential \
            pkg-config

      - name: Install Poetry
        run: pipx install poetry

      - name: Install Python deps
        run: poetry install --with dev

      - name: Runtime tests
        run: poetry run pytest -m runtime
